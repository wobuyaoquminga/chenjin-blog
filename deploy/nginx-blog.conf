# Include inside the existing HTTPS server block. Other applications keep their routes.
location = /sw.js {
    alias /opt/chenjin-blog/cloudreve-sw.js;
    default_type text/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
}
location = /blog { return 301 /blog/; }
location ^~ /blog/ {
    root /var/www/chenjin;
    index index.php;
    client_max_body_size 40m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ ^/blog/(wp-config\.php|xmlrpc\.php|readme\.html|license\.txt)$ { deny all; }
    location ~ /\. { deny all; }
    location ~* ^/blog/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }
    location ~ ^/blog/.*\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm-blog.sock;
        fastcgi_read_timeout 120s;
    }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    try_files $uri $uri/ /blog/index.php?$args;
}
