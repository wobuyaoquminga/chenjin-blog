name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find wp-content deploy -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Public repository synchronization checks
        run: php wp-content/plugins/chenjin-github/test-sync.php
      - name: Private contact validation checks
        run: php wp-content/plugins/chenjin-contact/test-validation.php
      - name: JavaScript syntax
        run: |
          node --check wp-content/themes/chenjin-news/reading.js
          node --check wp-content/themes/chenjin-news/motion.js
          node --input-type=module --check < wp-content/themes/chenjin-news/solar-system.js
          node --check tests/solar-system-check.cjs
          node --check wp-content/plugins/chenjin-github/projects.js
          node --check tests/browser-check.cjs
          node --check tests/public-check.cjs
          node --check tests/project-details-check.cjs
          node --check tests/dynamic-theme-check.cjs
          node --check tests/contact-check.cjs
          node --check tests/service-worker-check.cjs
      - name: Fixed motion checks
        run: node tests/solar-motion-check.cjs
      - name: Solar system bundle reproducibility
        run: |
          npx --yes esbuild@0.28.2 wp-content/themes/chenjin-news/solar-system.js --bundle --format=esm --minify --legal-comments=linked --outfile=wp-content/themes/chenjin-news/solar-system.min.js
          git diff --exit-code -- wp-content/themes/chenjin-news/solar-system.min.js wp-content/themes/chenjin-news/solar-system.min.js.LEGAL.txt
      - name: Deployment shell syntax
        run: bash -n deploy/install.sh deploy/update.sh deploy/backup.sh
