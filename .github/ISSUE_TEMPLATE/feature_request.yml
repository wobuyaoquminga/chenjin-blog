name: 功能建议
description: 提议改进博客的公开功能或使用体验
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 遇到的问题或使用场景
      description: 请说明谁在什么情况下需要这个改进。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 描述期望的效果；如有示例，请使用虚构或脱敏数据。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我没有提交密码、令牌、个人资料或原始生产数据。
          required: true
