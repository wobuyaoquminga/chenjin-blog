name: 问题反馈
description: 报告博客源码或功能的普通故障；安全问题请使用私密联系渠道
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "安全问题请通过 [陈今的站内联系页](https://121.43.101.242/blog/contact/) 私下报告，不要在公开 Issue 中发布漏洞细节或秘密。"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用可公开的最小示例说明如何复现。
      placeholder: "1. 打开……\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 相关浏览器、WordPress、PHP 版本；不了解可留空。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已移除密码、令牌、Cookie、私钥、个人资料及原始生产数据。
          required: true
